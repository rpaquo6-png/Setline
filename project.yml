name: WorkoutTracker
options:
  bundleIdPrefix: com.workouttracker
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

schemes:
  WorkoutTracker:
    build:
      targets:
        WorkoutTracker: all
        WorkoutWidgetExtension: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

targets:
  WorkoutTracker:
    type: application
    platform: iOS
    sources:
      - path: WorkoutTracker
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workouttrackerclaude.app
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_NSSupportsLiveActivities: true
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_ENTITLEMENTS: WorkoutTracker/WorkoutTracker.entitlements
    entitlements:
      path: WorkoutTracker/WorkoutTracker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.workouttrackerclaude.app
    dependencies:
      - target: WorkoutWidgetExtension
        embed: embed-and-sign

  WorkoutWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WorkoutWidgetExtension
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    info:
      path: WorkoutWidgetExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workouttrackerclaude.app.widget
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_ENTITLEMENTS: WorkoutWidgetExtension/WorkoutWidgetExtension.entitlements
    entitlements:
      path: WorkoutWidgetExtension/WorkoutWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.workouttrackerclaude.app
